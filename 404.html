<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — Salai Thant Zaw Win</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1220; --text: #e2e8f0; --muted: #94a3b8;
      --accent: #38bdf8; --accent-2: #818cf8;
      --accent-grad: linear-gradient(135deg, #38bdf8, #818cf8);
      --card: #121e33; --line: rgba(148, 163, 184, 0.15);
      --nav-h: 68px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Inter", system-ui, sans-serif;
      background:
        radial-gradient(700px 500px at 85% 10%, rgba(56, 189, 248, 0.12), transparent 65%),
        radial-gradient(600px 450px at 10% 90%, rgba(129, 140, 248, 0.1), transparent 60%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;
    }
    .code {
      font-family: "Sora", sans-serif;
      font-weight: 800;
      font-size: clamp(5rem, 18vw, 9rem);
      line-height: 1;
      background: var(--accent-grad);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    h1 { font-family: "Sora", sans-serif; font-size: clamp(1.3rem, 3.5vw, 1.8rem); margin: 10px 0 12px; }
    p { color: var(--muted); max-width: 46ch; margin: 0 auto 28px; line-height: 1.65; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 24px; border-radius: 12px;
      font-weight: 600; text-decoration: none; font-size: 0.95rem;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .btn-primary { background: var(--accent-grad); color: #fff; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(56, 189, 248, 0.25); }
    .btn-ghost { color: var(--muted); border: 1px solid var(--line); }
    .btn-ghost:hover { color: var(--text); border-color: rgba(148, 163, 184, 0.35); }
    .actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
    .brand { margin-bottom: 34px; font-family: "Sora", sans-serif; font-weight: 800; font-size: 1.15rem;
      background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  </style>
</head>
<body>
  <main>
    <div class="brand">STZW</div>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or may have moved. Let's get you back on track.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">← Back to home</a>
      <a class="btn btn-ghost" href="/#contact">Contact me</a>
    </div>
  </main>
</body>
</html>
